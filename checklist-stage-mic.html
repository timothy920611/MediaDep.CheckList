<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>講台與麥克風 Check List｜互動版</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8913a'/%3E%3Cpath d='M20 33l8 8 16-18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --card: #ffffff;
      --label: #1d1d1f;
      --label2: rgba(60, 60, 67, .62);
      --label3: rgba(60, 60, 67, .32);
      --sep: rgba(60, 60, 67, .18);
      --press: rgba(60, 60, 67, .10);
      --fill: rgba(120, 120, 128, .14);
      --tint: #98631a;
      --tint-strong: #c8913a;
      --tint-fill: rgba(200, 145, 58, .14);
      --green: #248a3d;
      --green-strong: #34c759;
      --red: #d70015;
      --bar: rgba(242, 242, 247, .9);
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
      --ease: cubic-bezier(.32, .72, 0, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --top: 64px;        /* 上方總進度列的高度（JS 會量） */
      --gutter: 16px;     /* 左右留白（JS 依視窗寬度計算，內容最寬 760px） */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #1c1c1e; --label: #f5f5f7;
        --label2: rgba(235, 235, 245, .62); --label3: rgba(235, 235, 245, .30);
        --sep: rgba(84, 84, 88, .55); --press: rgba(255, 255, 255, .08); --fill: rgba(120, 120, 128, .26);
        --tint: #e6b76a; --tint-strong: #d9a24c; --tint-fill: rgba(230, 183, 106, .16);
        --green: #30d158; --green-strong: #30d158; --red: #ff453a;
        --bar: rgba(18, 18, 20, .88); --shadow: none;
      }
    }
    html { scroll-padding-top: var(--top); overflow-x: clip; }
    body {
      min-height: 100%;
      background: var(--bg); color: var(--label);
      font: 17px/1.5 var(--font);
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
      padding-bottom: calc(60px + env(safe-area-inset-bottom));
    }
    button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; touch-action: manipulation; }
    :focus-visible { outline: 3px solid var(--tint-strong); outline-offset: 2px; border-radius: 10px; }

    .material {
      background: var(--bar);
      -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    }

    /* ── 上方：標題 + 總進度（一直黏在最上面）── */
    .top {
      position: sticky; top: 0; z-index: 20;
      padding: env(safe-area-inset-top) var(--gutter) 12px;
      box-shadow: 0 .5px 0 var(--sep);
    }
    .top-row { height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .embedded .top-row { display: none; }
    .embedded .top { padding-top: 12px; }
    .back { justify-self: start; display: inline-flex; align-items: center; gap: 4px; height: 44px; margin-left: -8px; padding: 0 8px; color: var(--tint); }
    .back svg { width: 12px; height: 20px; }
    .title { font-size: 17px; font-weight: 600; white-space: nowrap; }
    .progress-row { display: flex; align-items: center; gap: 12px; }
    .count { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .count small { font-size: 15px; font-weight: 400; color: var(--label2); }
    .track { flex: 1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
    .fill { height: 100%; width: 100%; border-radius: 3px; background: var(--tint-strong); transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease), background-color .3s; }
    .all-done .fill { background: var(--green-strong); }
    .text-btn { color: var(--tint); font-size: 15px; padding: 6px 4px; }
    .text-btn:active { opacity: .45; }

    /* ── 區塊：標題黏在頂端，捲動時縮成精簡列 ── */
    .sec { --c: 0; padding: 0 var(--gutter) 8px; }
    .sec + .sec { margin-top: 28px; }
    .sec-head {
      position: sticky; top: var(--top); z-index: 10;
      height: 58px; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter);
      display: flex; align-items: center; gap: 12px;
    }
    .sec-head::before { /* 材質背景：只有黏住後才浮現 */
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--bar);
      -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      box-shadow: 0 .5px 0 var(--sep);
      opacity: var(--c);
    }
    .sec-title {
      flex: 1; min-width: 0;
      font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transform-origin: left center;
      transform: translateY(calc(var(--c) * 7px)) scale(calc(1 - .38 * var(--c)));   /* 28px → 約 17px */
      will-change: transform;
    }
    .sec-phase { /* 縮小後才出現在標題前的小標 */
      font-size: 13px; font-weight: 600; color: var(--tint);
      position: absolute; left: var(--gutter); top: 4px;
      opacity: calc(var(--c) * 2.5 - 1.5);
      transform: translateY(calc((1 - var(--c)) * 6px));
    }
    .sec-count {
      flex: none; padding: 3px 10px; border-radius: 999px;
      background: var(--fill); color: var(--label2);
      font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
      transition: background-color .25s, color .25s;
    }
    .sec.complete .sec-count { background: color-mix(in srgb, var(--green-strong) 18%, transparent); color: var(--green); }
    .sec-bar { /* 黏住時底部的小進度條 */
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
      background: var(--tint-strong); transform-origin: left; transform: scaleX(var(--p, 0));
      opacity: var(--c); transition: transform .5s var(--ease), background-color .3s;
    }
    .sec.complete .sec-bar { background: var(--green-strong); }

    .sec-meta {
      display: flex; align-items: center; gap: 8px; padding: 0 2px 12px;
      font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums;
      opacity: calc(1 - var(--c) * 2.5);
    }
    .phase { padding: 2px 9px; border-radius: 999px; background: var(--tint-fill); color: var(--tint); font-weight: 600; }

    .list { list-style: none; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
    .item {
      position: relative; display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 16px; cursor: pointer; transition: background-color .25s;
      -webkit-user-select: none; user-select: none;
    }
    .item:active { background: var(--press); transition: none; }
    .list li + li .item::before { content: ""; position: absolute; top: 0; right: 0; left: 54px; height: .5px; background: var(--sep); }
    .item input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
    .circle {
      flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%;
      border: 2px solid var(--label3); display: grid; place-items: center;
      transition: background-color .2s, border-color .2s;
    }
    .circle svg { width: 13px; height: 13px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .35s cubic-bezier(.34, 1.56, .64, 1); }
    .item input:checked + .circle { background: var(--tint-strong); border-color: var(--tint-strong); animation: pop .35s var(--ease); }
    .item input:checked + .circle svg { opacity: 1; transform: none; }
    .item input:focus-visible + .circle { outline: 3px solid var(--tint-strong); outline-offset: 2px; }
    @keyframes pop { 40% { transform: scale(.82); } 100% { transform: scale(1); } }
    .text { font-size: 16px; line-height: 1.55; transition: color .2s; }
    .item input:checked ~ .text { color: var(--label2); }

    .foot { padding: 10px 16px 0; font-size: 13px; color: var(--label2); min-height: 2em; font-variant-numeric: tabular-nums; }
    .sec.complete .foot { color: var(--green); font-weight: 600; }

    /* 進入畫面時淡入（第一個畫面一定直接可見） */
    .reveal { transition: opacity .6s var(--ease), transform .6s var(--ease); }
    .reveal.waiting { opacity: 0; transform: translateY(16px); }

    /* 完成區 */
    .finish {
      min-height: calc(100vh - var(--top) - 60px);
      display: grid; place-items: center; align-content: center; text-align: center; gap: 10px;
      padding: 40px var(--gutter);
    }
    .badge { width: 88px; height: 88px; border-radius: 50%; background: var(--green-strong); color: #fff; display: grid; place-items: center; margin-bottom: 8px; transition: background-color .3s, transform .5s var(--ease); }
    .badge svg { width: 44px; height: 44px; }
    .finish.pending .badge { background: var(--fill); color: var(--label3); transform: scale(.9); }
    .finish h2 { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
    .finish p { color: var(--label2); font-size: 16px; max-width: 26em; }
    .finish .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; min-width: 220px; }
    .btn-filled { padding: 13px 22px; border-radius: 14px; background: var(--tint-strong); color: #fff; font-weight: 600; }
    .btn-plain { padding: 11px 22px; color: var(--red); }
    .btn-filled:active, .btn-plain:active { opacity: .6; }

    /* ── 下方：區塊切換 ── */
    .bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      box-shadow: 0 -.5px 0 var(--sep);
    }
    .nav-btn { height: 44px; min-width: 88px; padding: 0 10px; display: inline-flex; align-items: center; gap: 4px; color: var(--tint); font-size: 16px; border-radius: 10px; }
    .nav-btn.next { justify-content: flex-end; }
    .nav-btn:active { opacity: .45; }
    .nav-btn:disabled { color: var(--label3); cursor: default; }
    .nav-btn svg { width: 10px; height: 16px; }
    .dots { display: flex; gap: 4px; }
    .dot { width: 24px; height: 28px; display: grid; place-items: center; }
    .dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--label3); transition: background-color .25s, transform .25s var(--ease); }
    .dot.done i { background: color-mix(in srgb, var(--green-strong) 55%, transparent); }
    .dot.cur i { background: var(--label); transform: scale(1.2); }
    .dot.done.cur i { background: var(--green-strong); }
    @media (max-width: 420px) { .nav-btn { min-width: 64px; } .nav-btn span { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      .circle, .circle svg, .fill, .dot i, .sec-bar, .badge { transition: none; animation: none !important; }
      .reveal, .reveal.waiting { transition: none; opacity: 1; transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .material, .sec-head::before { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
    }
    @media (prefers-contrast: more) {
      :root { --label2: var(--label); --label3: var(--label2); }
      .list { outline: 1px solid var(--label3); }
    }
  </style>
</head>
<body>
  <header class="top material" id="top">
    <div class="top-row">
      <a class="back" href="./">
        <svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
        媒體部門
      </a>
      <div class="title">講台與麥克風</div>
    </div>
    <div class="progress-row">
      <div class="count" id="count">0 <small>/ 9 已確認</small></div>
      <div class="track" role="progressbar" aria-label="總進度" id="track"><div class="fill" id="fill"></div></div>
      <button class="text-btn" id="resetBtn" type="button">重設</button>
    </div>
  </header>

  <main id="list" aria-label="Check List"></main>

  <nav class="bottom material" aria-label="區塊切換">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="上一區">
      <svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 2 8l6 6"/></svg><span>上一區</span>
    </button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn next" id="nextBtn" type="button" aria-label="下一區">
      <span>下一區</span><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 6 6-6 6"/></svg>
    </button>
  </nav>

  <script>
    // key 固定不變：之後增減項目，已勾選的進度也不會錯位
    const sections = [
      { key: 'stage-before', phase: '聚會前', title: '講台弟兄', tag: 'Stage Brother', items: [
        "請留意示範麥克風擺放方向",
        "與公眾演講講者確認麥克風高度",
        "預先調好誦讀弟兄麥克風"
      ]},
      { key: 'stage-during', phase: '聚會中', title: '講台弟兄', tag: 'During · Stage', items: [
        "留意麥克風高度",
        "留意示範麥克風擺放方向"
      ]},
      { key: 'mic', phase: '聚會前・中', title: '麥克風傳遞員', tag: 'Mic Runner', items: [
        "請最後確認無線麥克風電量",
        "保護無線麥克風，請勿將麥克風放置在容易掉落的地方，如椅子上。",
        "留意是否有問答討論的環節",
        "確認評論的人是否有聲音，並隨時支援"
      ]}
    ];

    const STORAGE_KEY = 'media-dept-stage-mic-checklist-v2';
    // v1 有兩個麥克風傳遞員區塊，舊的勾選紀錄直接清掉
    try { localStorage.removeItem('media-dept-stage-mic-checklist-v1'); localStorage.removeItem('media-dept-stage-mic-checklist-v1:total'); } catch (e) {}
    const $ = (id) => document.getElementById(id);
    const list = $('list'), dots = $('dots');
    const totalItems = sections.reduce((n, s) => n + s.items.length, 0);
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    const store = {
      load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } },
      save(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {} },
      clear() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} },
    };
    let state = store.load() || {};
    store.save(state);
    try { localStorage.setItem(STORAGE_KEY + ':total', String(totalItems)); } catch (e) {}

    const itemId = (s, i) => `${sections[s].key}-${i}`;
    const esc = (str) => String(str).replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    const doneIn = (s) => sections[s].items.filter((_, i) => state[itemId(s, i)]).length;
    const isComplete = (s) => doneIn(s) === sections[s].items.length;
    const CHECK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 7.5 3 3 6-7"/></svg>';

    function render() {
      list.innerHTML = sections.map((sec, s) => `
        <section class="sec" id="sec-${s}" data-index="${s}" aria-labelledby="t-${s}">
          <header class="sec-head">
            <span class="sec-phase" aria-hidden="true">${esc(sec.phase)} · ${s + 1}/${sections.length}</span>
            <h2 class="sec-title" id="t-${s}">${esc(sec.title)}</h2>
            <span class="sec-count" id="c-${s}"></span>
            <span class="sec-bar" aria-hidden="true"></span>
          </header>
          <div class="sec-meta"><span class="phase">${esc(sec.phase)}</span><span>${esc(sec.tag)}</span><span>· ${s + 1} / ${sections.length}</span></div>
          <ul class="list reveal">
            ${sec.items.map((item, i) => {
              const id = itemId(s, i);
              return `<li><label class="item">
                <input type="checkbox" data-section="${s}" data-id="${id}" ${state[id] ? 'checked' : ''}>
                <span class="circle" aria-hidden="true">${CHECK}</span>
                <span class="text">${esc(item)}</span>
              </label></li>`;
            }).join('')}
          </ul>
          <p class="foot" id="f-${s}"></p>
        </section>`).join('') + `
        <section class="finish reveal" id="sec-${sections.length}" data-index="${sections.length}" aria-label="完成">
          <div class="badge">${CHECK.replace('stroke-width="2.4"', 'stroke-width="2"')}</div>
          <h2 id="finishTitle">全部完成</h2>
          <p id="finishText"></p>
          <div class="btns">
            <button class="btn-filled" type="button" data-goto="0">回到第一區</button>
            <button class="btn-plain" type="button" data-reset>重設所有勾選</button>
          </div>
        </section>`;

      dots.innerHTML = Array.from({ length: sections.length + 1 }, (_, i) =>
        `<button class="dot" type="button" data-goto="${i}" aria-label="${i < sections.length ? sections[i].title : '完成'}"><i></i></button>`).join('');
      secs = [...document.querySelectorAll('.sec, .finish')];
      heads = secs.slice(0, sections.length);
      updateProgress();
      setupReveal();
      onScroll();
    }

    function updateProgress() {
      const checked = Object.values(state).filter(Boolean).length;
      $('count').innerHTML = `${checked} <small>/ ${totalItems} 已確認</small>`;
      $('fill').style.transform = `scaleX(${checked / totalItems})`;
      $('track').setAttribute('aria-valuenow', Math.round(checked / totalItems * 100));
      document.body.classList.toggle('all-done', checked === totalItems);
      sections.forEach((sec, s) => {
        const n = doneIn(s), ok = n === sec.items.length, el = $('sec-' + s);
        el.classList.toggle('complete', ok);
        el.style.setProperty('--p', n / sec.items.length);
        $('c-' + s).textContent = ok ? '✓ 完成' : `${n} / ${sec.items.length}`;
        $('f-' + s).textContent = ok ? '這一區完成了' : '全部勾選後會自動捲到下一區';
        dots.children[s] && dots.children[s].classList.toggle('done', ok);
      });
      const left = totalItems - checked;
      $('sec-' + sections.length).classList.toggle('pending', left > 0);
      $('finishTitle').textContent = left ? `還有 ${left} 項` : '全部完成';
      $('finishText').textContent = left
        ? '點下方的圓點可以回到還沒完成的區塊。'
        : `所有 ${totalItems} 個項目都已確認。若要重新操作，請按「重設所有勾選」。`;
    }

    /* ── 捲動是唯一的狀態來源：標題縮放、目前區塊、圓點都由捲動位置推算 ── */
    let secs = [], heads = [], topH = 64, current = 0, ticking = false;
    const SHRINK = 56; // 黏住後再捲多少 px 完成縮小

    function measure() {
      topH = $('top').getBoundingClientRect().height;
      const root = document.documentElement;
      root.style.setProperty('--top', topH + 'px');
      root.style.setProperty('--gutter', Math.max(16, (root.clientWidth - 760) / 2) + 'px'); // 黏住的標題列要滿版
    }
    function onScroll() {
      ticking = false;
      heads.forEach((el) => {
        const past = topH - el.getBoundingClientRect().top; // 區塊頂端超過黏住線多少
        let c = Math.min(1, Math.max(0, past / SHRINK));
        if (reduceMotion.matches) c = past > 0 ? 1 : 0;
        el.style.setProperty('--c', c.toFixed(3));
      });
      const line = topH + 80;
      let idx = 0;
      secs.forEach((el, i) => { if (el.getBoundingClientRect().top <= line) idx = i; });
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) idx = secs.length - 1;
      current = idx;
      [...dots.children].forEach((d, i) => { d.classList.toggle('cur', i === idx); d.setAttribute('aria-current', i === idx ? 'step' : 'false'); });
      $('prevBtn').disabled = idx === 0 && scrollY < 4;
      $('nextBtn').disabled = idx === secs.length - 1;
    }
    addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
    addEventListener('resize', () => { measure(); onScroll(); });
    if ('ResizeObserver' in window) new ResizeObserver(() => { measure(); onScroll(); }).observe($('top'));

    function stopFor(i) {
      const el = secs[Math.max(0, Math.min(secs.length - 1, i))];
      return Math.max(0, el.getBoundingClientRect().top + scrollY - topH);
    }
    function goTo(i, instant) {
      scrollTo({ top: stopFor(i), behavior: instant || reduceMotion.matches ? 'auto' : 'smooth' });
    }

    /* 畫面外的清單進入時才淡入；一開始就看得到的不藏 */
    let io;
    function setupReveal() {
      if (io) io.disconnect();
      if (!('IntersectionObserver' in window) || reduceMotion.matches) return;
      io = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.remove('waiting'); io.unobserve(e.target); }
      }), { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach((el) => {
        if (el.getBoundingClientRect().top > innerHeight) { el.classList.add('waiting'); io.observe(el); }
      });
    }

    let advanceTimer = 0;
    list.addEventListener('change', (e) => {
      const input = e.target;
      if (!input.matches('input[type="checkbox"]')) return;
      if (input.checked) state[input.dataset.id] = true; else delete state[input.dataset.id];
      store.save(state);
      if (input.checked && navigator.vibrate) navigator.vibrate(8);
      updateProgress();
      clearTimeout(advanceTimer);
      const s = Number(input.dataset.section);
      if (input.checked && isComplete(s)) {
        // 停一下讓人看到「完成」，再捲到下一區
        advanceTimer = setTimeout(() => { if (isComplete(s)) goTo(s + 1); }, 650);
      }
    });

    document.addEventListener('click', (e) => {
      const g = e.target.closest('[data-goto]');
      if (g) goTo(Number(g.dataset.goto));
      if (e.target.closest('[data-reset]')) reset();
    });
    $('prevBtn').addEventListener('click', () => {
      // 在區塊中間時，先回到這一區開頭
      const here = stopFor(current);
      goTo(scrollY > here + 8 ? current : current - 1);
    });
    $('nextBtn').addEventListener('click', () => goTo(current + 1));
    $('resetBtn').addEventListener('click', reset);

    function reset() {
      if (!confirm('要清除所有勾選嗎？此動作無法復原。')) return;
      state = {};
      store.save(state);
      render();
      goTo(0);
    }

    // 另一個分頁改了勾選 → 同步
    addEventListener('storage', (e) => {
      if (e.key !== STORAGE_KEY) return;
      state = store.load() || {};
      document.querySelectorAll('input[data-id]').forEach((inp) => { inp.checked = !!state[inp.dataset.id]; });
      updateProgress();
    });

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    measure();
    render();
    // 打開時直接跳到第一個還沒完成的區塊
    const firstOpen = sections.findIndex((_, s) => !isComplete(s));
    if (firstOpen > 0 || firstOpen === -1) requestAnimationFrame(() => { goTo(firstOpen === -1 ? sections.length : firstOpen, true); setupReveal(); });
  </script>
</body>
</html>
